<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#171717" />
		<style>
			:root {
				--shell-bg: oklch(1 0 0);
				--shell-fg: oklch(0.145 0 0);
				--shell-border: oklch(0 0 0 / 0.05);
				--shell-pane-sidebar: oklch(0.965 0 0);
				--shell-pane-editor: oklch(1 0 0);
				--shell-list-search: oklch(0 0 0 / 0.04);
				--shell-eyebrow: oklch(0.145 0 0 / 0.45);
				--shell-item-bg: oklch(0.145 0 0 / 0.015);
				--shell-item-line: oklch(0.145 0 0 / 0.06);
				--shell-grip: oklch(0 0 0 / 0.08);
				--shell-shimmer: linear-gradient(
					90deg,
					transparent 0%,
					oklch(0.145 0 0 / 0.02) 50%,
					transparent 100%
				);
			}

			.dark {
				--shell-bg: oklch(0.145 0 0);
				--shell-fg: oklch(0.985 0 0);
				--shell-border: oklch(1 0 0 / 0.1);
				--shell-pane-sidebar: oklch(0.205 0 0 / 0.4);
				--shell-pane-editor: oklch(0.205 0 0);
				--shell-list-search: oklch(0.269 0 0 / 0.25);
				--shell-eyebrow: oklch(0.708 0 0 / 0.7);
				--shell-item-bg: oklch(1 0 0 / 0.02);
				--shell-item-line: oklch(1 0 0 / 0.08);
				--shell-grip: oklch(1 0 0 / 0.1);
				--shell-shimmer: linear-gradient(
					90deg,
					transparent 0%,
					oklch(1 0 0 / 0.04) 50%,
					transparent 100%
				);
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: var(--shell-bg);
				color: var(--shell-fg);
			}

			body {
				font-family:
					'Inter Variable',
					Inter,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'SF Pro Display',
					sans-serif;
			}

			#startup-shell {
				position: fixed;
				inset: 0;
				background: var(--shell-bg);
				opacity: 1;
				visibility: visible;
				transition:
					opacity 180ms ease,
					visibility 180ms ease;
				z-index: 9999;
				pointer-events: none;
			}

			html[data-app-ready='true'] #startup-shell {
				opacity: 0;
				visibility: hidden;
			}

			.startup-shell__body {
				display: grid;
				grid-template-columns: 256px 0px 350px 0px minmax(0, 1fr);
				height: 100%;
				min-height: 0;
				opacity: 0;
			}

			.startup-shell__pane-resize-handle {
				display: none;
			}

			@media (min-width: 768px) {
				.startup-shell__pane-resize-handle {
					display: flex;
					width: 0px;
					flex-shrink: 0;
					background: grey;
					align-items: center;
					justify-content: center;
					position: relative;
					overflow: visible;
				}

				.startup-shell__pane-resize-grip {
					height: 48px;
					width: 3px;
					border-radius: 9999px;
					background: var(--shell-grip);
					position: absolute;
					left: 0;
					margin-left: -1px;
					top: 50%;
					transform: translateY(-50%);
				}

				.startup-shell__pane-resize-handle[data-handle='note-list']
					.startup-shell__pane-resize-grip {
					transform: translate(10px, -50%);
				}
			}

			.startup-shell__pane {
				min-width: 0;
			}

			.startup-shell__pane--sidebar {
				background: var(--shell-pane-sidebar);
				padding: 24px 0;
			}

			.startup-shell__pane--list {
				background: var(--shell-bg);
				display: flex;
				flex-direction: column;
			}

			.startup-shell__pane--editor {
				background: var(--shell-pane-editor);
				padding: 40px;
			}

			.startup-shell__eyebrow {
				margin-bottom: 8px;
				padding: 0 16px;
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: var(--shell-eyebrow);
			}

			.startup-shell__folder-tree {
				display: flex;
				flex-direction: column;
				gap: 2px;
				padding: 0 8px;
			}

			.startup-shell__folder-row {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 32px;
				padding: 0 12px;
				border-radius: 6px;
			}

			.startup-shell__folder-row--nested-1 {
				padding-left: 24px;
			}

			.startup-shell__folder-row--nested-2 {
				padding-left: 36px;
			}

			.startup-shell__folder-icon {
				width: 16px;
				height: 16px;
				border-radius: 3px;
				background: var(--shell-item-line);
				flex: 0 0 auto;
			}

			.startup-shell__folder-label {
				flex: 0 0 auto;
				height: 12px;
				border-radius: 9999px;
				background: var(--shell-item-bg);
				position: relative;
				overflow: hidden;
			}

			.startup-shell__note-list-header {
				height: 52px;
				padding: 0 24px;
				display: flex;
				align-items: center;
				flex-shrink: 0;
			}

			.startup-shell__note-list-search {
				height: 34px;
				margin: 0 12px 16px 12px;
				border-radius: 6px;
				background: var(--shell-list-search);
				flex-shrink: 0;
				position: relative;
				overflow: hidden;
			}

			.startup-shell__note-list-eyebrow {
				margin-top: 24px;
				padding: 0 28px;
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: var(--shell-eyebrow);
				opacity: 0.6;
				margin-bottom: 12px;
			}

			.startup-shell__note-list {
				display: flex;
				flex-direction: column;
			}

			.startup-shell__note-item {
				position: relative;
				height: 72px;
				margin: 0 16px 4px 16px;
				border-radius: 6px;
				background: var(--shell-item-bg);
				overflow: hidden;
			}

			.startup-shell__note-item-line,
			.startup-shell__note-item-meta {
				position: absolute;
				border-radius: 9999px;
				background: var(--shell-item-line);
				z-index: 1;
			}

			.startup-shell__note-item-line--title {
				top: 16px;
				left: 12px;
				height: 12px;
			}

			.startup-shell__note-item-line--body {
				top: 40px;
				left: 12px;
				height: 10px;
			}

			.startup-shell__note-item-meta {
				right: 12px;
				top: 18px;
				height: 8px;
			}

			.startup-shell__line {
				position: relative;
				overflow: hidden;
				border-radius: 10px;
				background: var(--shell-item-bg);
			}

			.startup-shell__folder-label::after,
			.startup-shell__note-list-search::after,
			.startup-shell__note-item::after,
			.startup-shell__line::after {
				content: '';
				position: absolute;
				inset: 0;
				background: var(--shell-shimmer);
				transform: translateX(-100%);
				animation: startup-shell-shimmer 1.5s infinite;
			}

			.startup-shell__line {
				height: 12px;
				margin-bottom: 12px;
			}

			.startup-shell__line--lg {
				height: 24px;
				margin-bottom: 24px;
			}

			.startup-shell__spacer {
				height: 24px;
			}

			@keyframes startup-shell-shimmer {
				100% {
					transform: translateX(100%);
				}
			}
		</style>
		<script>
			(function () {
				var bodyRevealed = false;
				function revealBody() {
					if (bodyRevealed) return;
					bodyRevealed = true;
					var s = document.createElement('style');
					s.textContent = '.startup-shell__body { opacity: 1 !important; }';
					document.head.appendChild(s);
				}

				if (typeof window.runtime === 'undefined') {
					revealBody();
					return;
				}

				try {
					var dbName = window.__NOTES_DB_NAME__ || 'kelocnotes-db';
					var request = window.indexedDB.open(dbName);
					request.onerror = revealBody;
					request.onsuccess = function (event) {
						var db = event.target.result;
						if (!db.objectStoreNames.contains('settings')) {
							db.close();
							return revealBody();
						}

						var tx = db.transaction('settings', 'readonly');
						var store = tx.objectStore('settings');

						var sidebarReq = store.get('sidebarWidth');
						var noteListReq = store.get('noteListWidth');
						var themeReq = store.get('applicationTheme');

						tx.oncomplete = function () {
							// Apply theme before revealing body to prevent FOUC
							var savedTheme = themeReq.result || 'system';
							var isDark =
								savedTheme === 'dark' ||
								(savedTheme === 'system' &&
									window.matchMedia('(prefers-color-scheme: dark)').matches);

							if (isDark) {
								document.documentElement.classList.add('dark');
							} else {
								document.documentElement.classList.remove('dark');
							}

							var sidebarWidth = typeof sidebarReq.result === 'number' ? sidebarReq.result : 256;
							var noteListWidth = typeof noteListReq.result === 'number' ? noteListReq.result : 350;

							var style = document.createElement('style');
							style.textContent =
								'.startup-shell__body { grid-template-columns: ' +
								sidebarWidth +
								'px 10px ' +
								noteListWidth +
								'px 10px minmax(0, 1fr) !important; opacity: 1 !important; }';
							document.head.appendChild(style);
							bodyRevealed = true;
							db.close();
						};
						tx.onerror = function () {
							db.close();
							revealBody();
						};
						tx.onabort = function () {
							db.close();
							revealBody();
						};
					};
				} catch (e) {
					revealBody();
				}

				// Fallback to avoid eternal blank if IDB hangs
				setTimeout(revealBody, 150);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="startup-shell" aria-hidden="true">
			<div class="startup-shell__body">
				<section class="startup-shell__pane startup-shell__pane--sidebar">
					<div class="startup-shell__eyebrow">Folders</div>
					<div class="startup-shell__folder-tree">
						<div class="startup-shell__folder-row">
							<div class="startup-shell__folder-icon"></div>
							<div class="startup-shell__folder-label" style="width: 118px"></div>
						</div>
						<div class="startup-shell__folder-row startup-shell__folder-row--nested-1">
							<div class="startup-shell__folder-icon"></div>
							<div class="startup-shell__folder-label" style="width: 102px"></div>
						</div>
						<div class="startup-shell__folder-row startup-shell__folder-row--nested-2">
							<div class="startup-shell__folder-icon"></div>
							<div class="startup-shell__folder-label" style="width: 88px"></div>
						</div>
					</div>
					<div class="startup-shell__spacer"></div>
					<div class="startup-shell__eyebrow" style="opacity: 0.5">Tags</div>
					<div class="startup-shell__folder-tree">
						<div class="startup-shell__folder-row">
							<div class="startup-shell__folder-icon"></div>
							<div class="startup-shell__folder-label" style="width: 138px"></div>
						</div>
						<div class="startup-shell__folder-row startup-shell__folder-row--nested-1">
							<div class="startup-shell__folder-icon"></div>
							<div class="startup-shell__folder-label" style="width: 120px"></div>
						</div>
						<div class="startup-shell__folder-row">
							<div class="startup-shell__folder-icon"></div>
							<div class="startup-shell__folder-label" style="width: 126px"></div>
						</div>
					</div>
				</section>

				<div class="startup-shell__pane-resize-handle" data-handle="sidebar">
					<span class="startup-shell__pane-resize-grip" aria-hidden="true"></span>
				</div>

				<section class="startup-shell__pane startup-shell__pane--list">
					<div class="startup-shell__note-list-header">
						<div class="startup-shell__folder-icon"></div>
						<div class="startup-shell__folder-label" style="width: 80px; margin-left: 8px"></div>
					</div>
					<div class="startup-shell__note-list-search"></div>

					<div class="startup-shell__note-list-eyebrow">Notes</div>
					<div class="startup-shell__note-list">
						<div class="startup-shell__note-item">
							<div
								class="startup-shell__note-item-line startup-shell__note-item-line--title"
								style="width: 152px"
							></div>
							<div
								class="startup-shell__note-item-line startup-shell__note-item-line--body"
								style="width: 228px"
							></div>
							<div class="startup-shell__note-item-meta" style="width: 42px"></div>
						</div>
						<div class="startup-shell__note-item">
							<div
								class="startup-shell__note-item-line startup-shell__note-item-line--title"
								style="width: 124px"
							></div>
							<div
								class="startup-shell__note-item-line startup-shell__note-item-line--body"
								style="width: 186px"
							></div>
							<div class="startup-shell__note-item-meta" style="width: 36px"></div>
						</div>
						<div class="startup-shell__note-item">
							<div
								class="startup-shell__note-item-line startup-shell__note-item-line--title"
								style="width: 168px"
							></div>
							<div
								class="startup-shell__note-item-line startup-shell__note-item-line--body"
								style="width: 258px"
							></div>
							<div class="startup-shell__note-item-meta" style="width: 48px"></div>
						</div>
					</div>
				</section>

				<div class="startup-shell__pane-resize-handle" data-handle="note-list">
					<span class="startup-shell__pane-resize-grip" aria-hidden="true"></span>
				</div>

				<section class="startup-shell__pane startup-shell__pane--editor">
					<div class="startup-shell__line startup-shell__line--lg" style="width: 56%"></div>
					<div class="startup-shell__spacer"></div>
					<div class="startup-shell__line" style="width: 100%"></div>
					<div class="startup-shell__line" style="width: 92%"></div>
					<div class="startup-shell__line" style="width: 98%"></div>
					<div class="startup-shell__line" style="width: 84%"></div>
					<div class="startup-shell__spacer"></div>
					<div class="startup-shell__line" style="width: 100%"></div>
					<div class="startup-shell__line" style="width: 72%"></div>
				</section>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
